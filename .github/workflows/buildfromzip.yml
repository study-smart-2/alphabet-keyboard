name: Build APK from zip

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p work
          unzip -q AnimoKeyboard.zip -d work
          SETTINGS=$(find work -name settings.gradle | head -n1)
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: cd "$PROJECT_DIR" && gradle --no-daemon assembleDebug

      - name: Publish release (download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Animo Keyboard (latest build)
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
